[package]
name = "rot"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "$ROT - a NEP-141 memecoin whose balance spoils unless you stamp it"
license = "MIT"
repository = "https://github.com/HarryAnalyzer/rot"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
# Storage on NEAR costs 1 NEAR per 100 KB of code, so the size of this wasm is
# a real bill, not a vanity metric. scripts/build.ps1 runs wasm-opt -Oz over it
# afterwards, which takes off another third.
