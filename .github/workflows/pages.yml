name: token page

# Publishes web/ to GitHub Pages, so the token page is a URL a judge can open
# rather than a local server they have to start. It is a static page that talks
# to NEAR over public RPC, so there is nothing to build and no secret to hold.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on from here rather than relying on someone having
          # flipped the repository setting first, so a fork of this repo
          # publishes the page without any manual step.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
